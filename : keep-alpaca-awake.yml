name: Keep Alpaca Bot Awake

on:
  schedule:
    # كل 10 دقايق، من الساعة 14:00 لين 20:59 UTC، الاثنين للجمعة
    # (يغطي ساعات التداول 14:30-21:00 UTC + نص ساعة هامش قبل الافتتاح)
    - cron: "*/10 14-20 * * 1-5"
  workflow_dispatch: {}   # يسمح بتشغيل يدوي للاختبار الفوري

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Alpaca bot to keep it awake
        run: |
          echo "⏰ إرسال طلب صحيان بمهلة انتظار 60 ثانية (بدل 30 ثانية عند cron-job.org)..."
          curl --fail --max-time 60 --silent --show-error \
            https://alpaca-trading-bot-worker.onrender.com/
          echo "✅ نجح الطلب — البوت صاحي"
