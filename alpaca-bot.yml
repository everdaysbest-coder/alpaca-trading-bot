name: Alpaca Trading Bot

on:
  schedule:
    - cron: "35 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python trading_bot.py

      - name: Commit daily state
        if: success()
        run: |
          git config user.name "alpaca-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily_state.json
          git diff --staged --quiet || git commit -m "chore: update daily risk state [skip ci]"
          git push
